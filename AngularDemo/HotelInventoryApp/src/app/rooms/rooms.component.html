<hinv-header></hinv-header>
<hinv-header></hinv-header>
<hinv-header></hinv-header>

<div [hidden]="hideRooms">
  Number of Rooms:
  <!--Dont use this, inline styles are not good!.-->
  <div
    [ngStyle]="{ color: (rooms?.availableRooms ?? 0 > 0) ? 'green' : 'red' }"
    [innerText]="numberOfRooms"
  ></div>
</div>

{{ rooms?.availableRooms ?? "No rooms" }}

<!--json pipes are normally only used for development purposes. I'd always output to console instead...-->
<!--{{ roomList | json }}-->

<div *ngIf="selectedRoom">
  {{ selectedRoom | json }}
</div>

<div>
  <button (click)="addRoom()">AddRoom</button>
</div>

<div *ngIf="hideRooms">
  <hinv-rooms-list
    [rooms]="roomList"
    [title]="title"
    (selectedRoom)="selectRoom($event)"
  ></hinv-rooms-list>
</div>
<button (click)="toggle()">Toggle Rooms</button>
