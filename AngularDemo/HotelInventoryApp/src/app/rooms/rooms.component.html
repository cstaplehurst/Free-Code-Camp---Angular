<!--<h1>Welcome to {{ hotelName }}!</h1>-->
<hinv-header></hinv-header>

<div [hidden]="hideRooms">
  Number of Rooms:
  <!--Dont use this, inline styles are not good!.-->
  <div
    [ngStyle]="{ color: (rooms?.availableRooms ?? 0 > 0) ? 'green' : 'red' }"
    [innerText]="numberOfRooms"
  ></div>
</div>

{{ rooms?.availableRooms ?? "No rooms" }}

<!--json pipes are normally only used for development purposes. I'd always output to console instead...-->
<!--{{ roomList | json }}-->

<div *ngIf="selectedRoom">
  {{ selectedRoom | json }}
</div>

<h1>
  {{ getError$ | async }}
  Number of Rooms: {{ roomsCount$ | async }}
</h1>
<div>
  <button (click)="addRoom()">Add Room</button>

  <button (click)="editRoom()">Edit Room</button>

  <button (click)="deleteRoom()">Delete Room</button>
</div>

<div *ngIf="rooms$ | async as rooms" [hidden]="hideRooms">
  <hinv-rooms-list
    [rooms]="rooms"
    [title]="title"
    (selectedRoom)="selectRoom($event)"
  ></hinv-rooms-list>
</div>
<button (click)="toggle()">Toggle Rooms</button>

<h1>{{ totalBytes }} loaded</h1>
